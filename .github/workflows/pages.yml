name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract static website
        run: unzip -q zhuhaolawyer-site.zip -d site
      - name: Normalize canonical route URLs
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          route_url_re = re.compile(r'https://zhuhaolawyer\.com/[^\s"<>)\]]*')

          def add_trailing_slash(match):
              url = match.group(0)
              core, hash_sep, fragment = url.partition("#")
              core, query_sep, query = core.partition("?")
              if core.endswith("/"):
                  return url
              if "." in core.rsplit("/", 1)[-1]:
                  return url
              normalized = core + "/"
              if query_sep:
                  normalized += "?" + query
              if hash_sep:
                  normalized += "#" + fragment
              return normalized

          for text_file in Path("site").rglob("*"):
              if not text_file.is_file() or text_file.suffix.lower() not in {".html", ".json", ".txt", ".xml"}:
                  continue
              try:
                  text = text_file.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  # Next.js may emit binary route payloads with a .txt suffix.
                  # They must be preserved byte-for-byte and are not URL-normalized.
                  continue
              text = route_url_re.sub(add_trailing_slash, text)
              text_file.write_text(text, encoding="utf-8")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
