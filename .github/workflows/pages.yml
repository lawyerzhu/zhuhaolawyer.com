name: Deploy website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract static website
        run: unzip -q zhuhaolawyer-site.zip -d site
      - name: Apply current homepage copy
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path("site/index.html")
          html = page.read_text(encoding="utf-8")
          for label in (
              "2019.05—2020.04",
              "2023年公开报道",
              "2013年公开名单",
              "2021—2026三个周期",
              "2022.10—2024.09",
              "2023—2024年度",
              "2020—2021年度",
              "2022—2023年度",
          ):
              html = html.replace(f"<span>{label}</span>", "")
              html = html.replace(label, "")
          html = html.replace(
              "参与行政执法案卷评查反馈；该表述仅作2023年历史记录。",
              "参与行政执法案卷评查反馈；身份与事项以政府公开报道为核验依据。",
          )
          html = html.replace(
              "现任身份与公开材料中的历史经历分别标注；历史任职保留时间范围。",
              "现任身份、行业任职、公开履历与个人荣誉分类呈现；具体时间范围和核验依据见“可核验经历”。",
          )
          html = html.replace(
              "</head>",
              "<style>.evidence-note h3:first-child{margin-top:0}</style></head>",
              1,
          )
          page.write_text(html, encoding="utf-8")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
